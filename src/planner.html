<title>Planner de Bolso</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#3A1D6E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planner de Bolso">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: coluna de celular; o topo é um ingresso (livre do mês) com canhoto destacável (por dia); o resto fica quieto */
:root{
  --bg:#F2EEF8; --surface:#FFFFFF; --surface-2:#E9E3F3; --ink:#24163D; --muted:#6A5F80; --line:#DCD4EA;
  --plum:#3A1D6E; --plum-2:#7B3FE4; --on-plum:#FFFFFF; --plum-soft:#EAE0FB; --plum-ink:#5B2BB8;
  --save:#12805A; --save-soft:#DCF2E8; --spend:#CC4430; --spend-soft:#FBE3DE; --gold:#9A6B00; --gold-soft:#FFF1BF;
  --stub:#FFD84D; --stub-ink:#24163D; --marca:#FFE27A;
  --shadow:0 1px 2px rgba(36,22,61,.06),0 10px 28px rgba(36,22,61,.08);
  --font-display:'Big Shoulders Display','Arial Narrow','Roboto Condensed',sans-serif;
  --font-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#120C1C; --surface:#1D1529; --surface-2:#281E38; --ink:#F3EEFB; --muted:#AA9FC0; --line:#33284A;
  --plum:#43237F; --plum-2:#A57BFF; --on-plum:#FFFFFF; --plum-soft:#2C1F47; --plum-ink:#C3A6FF;
  --save:#4CCB9A; --save-soft:#163A2D; --spend:#FF8D75; --spend-soft:#3D211B; --gold:#F5C94F; --gold-soft:#3A2F12;
  --stub:#FFD84D; --stub-ink:#24163D; --marca:rgba(255,216,77,.38);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#120C1C; --surface:#1D1529; --surface-2:#281E38; --ink:#F3EEFB; --muted:#AA9FC0; --line:#33284A;
  --plum:#43237F; --plum-2:#A57BFF; --on-plum:#FFFFFF; --plum-soft:#2C1F47; --plum-ink:#C3A6FF;
  --save:#4CCB9A; --save-soft:#163A2D; --spend:#FF8D75; --spend-soft:#3D211B; --gold:#F5C94F; --gold-soft:#3A2F12;
  --stub:#FFD84D; --stub-ink:#24163D; --marca:rgba(255,216,77,.38);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35); color-scheme:dark;}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--plum-2);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.1}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:520px;margin:0 auto;padding-block:14px 128px;display:flex;flex-direction:column;gap:16px}

/* topo */
.top{display:flex;flex-direction:column;gap:12px}
.top-row{display:flex;align-items:center;gap:12px}
.avatar{width:46px;height:46px;border-radius:15px;background:var(--plum);color:var(--on-plum);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:22px;flex:none;transform:rotate(-4deg)}
.hello{flex:1;min-width:0}
.hello h1{font-size:26px;font-weight:800;letter-spacing:-.01em}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.icon-btn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;text-decoration:none;flex:none}
.icon-btn svg{width:22px;height:22px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;color:var(--muted);text-decoration:none}
.pill b{color:var(--ink);font-weight:700}

/* cédula */
.nota{position:relative;overflow:hidden;border-radius:26px;padding:20px 20px 18px;color:var(--on-plum);
  background:
   repeating-radial-gradient(circle at 112% -12%, rgba(255,255,255,.075) 0 1px, transparent 1.5px 10px),
   repeating-radial-gradient(circle at -15% 120%, rgba(255,255,255,.05) 0 1px, transparent 1.5px 12px),
   linear-gradient(140deg,var(--plum),var(--plum-2));
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.nota::after{content:"";position:absolute;inset:8px;border:1px dashed rgba(255,255,255,.22);border-radius:20px;pointer-events:none}
.nota-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nota .eyebrow{color:rgba(255,255,255,.78)}
.selo{font-family:var(--font-display);font-weight:800;font-size:13px;width:38px;height:38px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);display:grid;place-items:center;transform:rotate(-12deg)}
.nota-valor{font-family:var(--font-display);font-weight:800;font-size:clamp(38px,11vw,50px);letter-spacing:-.02em;line-height:1}
.nota-sub{font-size:15px;color:rgba(255,255,255,.9)}
.nota-sub b{color:#fff}
.nota-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px;padding-top:12px;border-top:1px solid rgba(255,255,255,.18)}
.nota-stats span{display:block;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:rgba(255,255,255,.72)}
.nota-stats b{font-size:15px;font-variant-numeric:tabular-nums}
.meter{height:10px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden}
.meter span{display:block;height:100%;border-radius:inherit;background:#fff;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.meter.warn span{background:var(--gold)}
.meter.over span{background:var(--spend)}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;border-radius:inherit;background:var(--save);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.gold span{background:var(--gold)}
.bar.plum span{background:var(--plum-2)}
.bar.thin{height:6px}

/* ações rápidas */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600;line-height:1.15;text-align:center}
.quick .ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:20px}
.quick button:active{transform:scale(.97)}
.ico.spend{background:var(--spend-soft)} .ico.save{background:var(--save-soft)} .ico.gold{background:var(--gold-soft)} .ico.plum{background:var(--plum-soft)}

/* cartões */
.card{background:var(--surface);border-radius:var(--r);padding:18px;border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card-head h2{font-size:19px;font-weight:700}
.card-head a,.link{font-size:14px;font-weight:600;color:var(--plum-ink);text-decoration:none;background:none;border:0;padding:0}
.sec{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-family:var(--font-body);font-weight:700;margin-top:6px}

.cofre{display:flex;align-items:center;gap:16px}
.ring{width:92px;height:92px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:20px}
.cofre-txt{display:flex;flex-direction:column;gap:6px;min-width:0}
.cofre-txt b{font-size:22px;font-family:var(--font-display);font-variant-numeric:tabular-nums}

.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.list .row:last-child{border-bottom:0}
.dot{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:19px;flex:none;background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.row-main b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-main small{color:var(--muted);font-size:13px}
.row-val{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.neg{color:var(--spend)} .pos{color:var(--save)}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--gold-soft);color:var(--gold);margin-left:4px;vertical-align:1px}

.conta{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.list .conta:last-child{border-bottom:0}
.check{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:.2s}
.conta.pago .check{background:var(--save);border-color:var(--save);color:var(--surface)}
.conta.pago .row-main b{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}

.dica{background:var(--gold-soft);border-color:transparent}
.dica p{font-size:15.5px}
.dica .eyebrow{color:var(--gold)}

.empty{padding:18px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:16px;font-size:14.5px}

/* botões */
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:700;font-size:15.5px;background:var(--surface-2);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--plum);color:var(--on-plum)}
.btn.save{background:var(--save);color:var(--surface)}
.btn.danger{background:var(--spend-soft);color:var(--spend)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.small{padding:8px 12px;font-size:14px;border-radius:11px}
.btn.block{width:100%}
.btn:active{transform:scale(.98)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}

/* semana */
.week-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.week-nav h2{font-size:19px;text-align:center;flex:1}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:150px;position:relative;padding-top:8px}
.bars .lim{position:absolute;left:0;right:0;border-top:2px dashed var(--gold);pointer-events:none}
.bars .lim span{position:absolute;right:0;top:-20px;font-size:11px;font-weight:700;color:var(--gold);background:var(--surface);padding:0 4px}
.bcol{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bcol i{display:block;width:100%;max-width:34px;border-radius:9px 9px 4px 4px;background:var(--plum-2);min-height:4px;transition:height .5s}
.bcol.over i{background:var(--spend)}
.bcol.zero i{background:var(--surface-2)}
.bcol small{font-size:12px;color:var(--muted);font-weight:600}
.bcol.today small{color:var(--plum-ink);font-weight:800}
.week-sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface-2);border-radius:14px;padding:12px}
.stat span{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.stat b{font-size:19px;font-family:var(--font-display);font-variant-numeric:tabular-nums}
.stat.good{background:var(--save-soft)} .stat.good b{color:var(--save)}
.stat.bad{background:var(--spend-soft)} .stat.bad b{color:var(--spend)}
.daygroup h3{font-size:14px;font-family:var(--font-body);font-weight:700;color:var(--muted);display:flex;justify-content:space-between;padding-top:4px}
.catbar{display:flex;flex-direction:column;gap:6px}
.catbar-top{display:flex;justify-content:space-between;gap:8px;font-size:14.5px}
.catbar .bar span{background:var(--c)}

/* metas */
.meta{gap:10px}
.meta-top{display:flex;align-items:center;gap:12px}
.meta-emoji{width:48px;height:48px;border-radius:16px;background:var(--plum-soft);display:grid;place-items:center;font-size:24px;flex:none}
.meta-top h3{font-size:18px;font-weight:700}
.meta-nums{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.meta-nums b{font-family:var(--font-display);font-size:22px}
.meta.done{border-color:var(--save);background:color-mix(in srgb,var(--save-soft) 60%,var(--surface))}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--save);color:var(--surface)}

/* desejos */
.desejo-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.desejo-top b{font-size:17px;min-width:0;overflow-wrap:anywhere}
.desejo-top .val{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.desejo.pronto{border-color:var(--gold)}
.big-stat{display:flex;flex-direction:column;background:var(--save-soft);border-radius:16px;padding:14px}
.big-stat span{font-size:13px;color:var(--muted);font-weight:600}
.big-stat b{font-family:var(--font-display);font-size:30px;color:var(--save);font-variant-numeric:tabular-nums}
.big-stat small{color:var(--muted)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:13.5px;font-weight:600;color:var(--muted)}
.input,.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:16px;min-width:0}
.field textarea{min-height:110px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.input:focus,.field input:focus,.field textarea:focus{outline:none;border-color:var(--plum-2)}
.money{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--line);padding:6px 2px}
.money:focus-within{border-color:var(--plum-2)}
.money span{font-family:var(--font-display);font-weight:700;font-size:26px;color:var(--muted)}
.money input{border:0;background:none;font-family:var(--font-display);font-weight:800;font-size:40px;width:100%;min-width:0;padding:0;outline:none;font-variant-numeric:tabular-nums}
.money-in{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:14px;padding:0 12px;background:var(--surface);flex:1;min-width:0}
.money-in span{color:var(--muted);font-weight:700}
.money-in input{border:0;background:none;padding:12px 0;width:100%;min-width:0;outline:none;font-size:16px}
.inline{display:flex;gap:8px;align-items:stretch}
.choice{display:flex;flex-wrap:wrap;gap:8px}
.choice label{position:relative}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice span{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:14.5px;font-weight:600;cursor:pointer}
.choice input:checked+span{border-color:var(--plum-2);background:var(--plum-soft);color:var(--plum-ink)}
.choice input:focus-visible+span{outline:3px solid var(--plum-2);outline-offset:2px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface-2);cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--plum-2)}
.range{width:100%;accent-color:var(--plum-2)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:9px;border-radius:10px;font-weight:600;font-size:14.5px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}
.hint{font-size:13.5px;color:var(--muted)}
.resumo{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.resumo li{display:flex;justify-content:space-between;gap:10px;font-size:15.5px}
.resumo li b{font-variant-numeric:tabular-nums}
.resumo li.total{border-top:1px solid var(--line);padding-top:8px;font-weight:700}

/* navegação */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;font-size:11.5px;font-weight:600;color:var(--muted);padding:6px 0}
.nav a svg{width:24px;height:24px}
.nav a[aria-current="page"]{color:var(--plum-ink)}
.fab{justify-self:center;width:62px;height:62px;border-radius:21px;border:0;background:var(--plum);color:var(--on-plum);display:grid;place-items:center;box-shadow:0 8px 22px rgba(74,44,122,.4);transform:translateY(-14px) rotate(-4deg);transition:transform .2s}
.fab:active{transform:translateY(-14px) scale(.95)}
.fab svg{width:30px;height:30px}

/* folha de baixo */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(15,10,25,.45);animation:fade .2s}
.sheet-card{position:relative;width:100%;max-width:560px;max-height:92dvh;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;
  padding:8px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:14px}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 0}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-head h2{font-size:21px;font-weight:800}
.sheet form{display:flex;flex-direction:column;gap:14px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}

.toast{position:fixed;left:0;right:0;margin-inline:auto;width:fit-content;bottom:calc(98px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14.5px;max-width:min(92vw,440px);text-align:center;box-shadow:var(--shadow);animation:up .25s}
#confete{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}

.banner{background:var(--gold-soft);color:var(--ink);border-radius:16px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.banner .btn{flex:none}

/* boas-vindas */
.onb{max-width:520px;margin:0 auto;min-height:100dvh;padding-block:20px 28px;display:flex;flex-direction:column;gap:20px}
.onb-dots{display:flex;gap:6px}
.onb-dots i{height:6px;flex:1;border-radius:9px;background:var(--line)}
.onb-dots i.on{background:var(--plum-2)}
.onb h1{font-size:clamp(30px,8.5vw,40px);font-weight:800;letter-spacing:-.02em}
.onb .lead{font-size:17px;color:var(--muted)}
.onb-body{display:flex;flex-direction:column;gap:14px;flex:1}
.onb-foot{display:flex;gap:10px}
.onb-foot .btn{flex:1;padding:15px}
.hero-onb{display:flex;flex-direction:column;gap:18px;flex:1;justify-content:center}
.hero-onb .nota{transform:rotate(-3deg);margin:8px 6px}
.feat{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.feat li{display:flex;gap:12px;align-items:flex-start;font-size:15.5px}
.feat li span{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;font-size:17px}

  const h=new Date();s.pagos[mkey(h)]=[s.fixos[1].id];
  const lista=[[0,18.5,'transporte','Uber pro trabalho'],[0,9,'comida','Café'],[1,86.4,'mercado','Mercado da semana'],[2,39.9,'compras','Blusinha da vitrine',1],[3,25,'lazer','Cinema'],[4,12.5,'comida','Pão de queijo'],[5,54,'saude','Farmácia'],[6,22,'transporte','Recarga do cartão'],[8,64,'mercado','Feira'],[9,35,'comida','Lanche no shopping',1]];
  lista.forEach(l=>{const d=new Date(h);d.setDate(h.getDate()-l[0]);if(d.getMonth()!==h.getMonth())return;s.gastos.push({id:uid(),valor:l[1],cat:l[2],desc:l[3],data:dkey(d),ts:d.getTime(),impulso:!!l[4]});});
  const m2={id:uid(),nome:'Viagem pra Salvador',emoji:'🏖️',alvo:1800,porque:'Quero ver o mar pela primeira vez com a minha mãe',prazo:mesKey(8)},m1={id:uid(),nome:'Reserva pra imprevistos',emoji:'🛟',alvo:1500,porque:'Pra não entrar no cheque especial se o celular quebrar',prazo:''};
  s.metas=[m2,m1];
  const mp=new Date(h.getFullYear(),h.getMonth()-1,10);
  s.depositos=[{id:uid(),metaId:m1.id,valor:250,data:dkey(mp)},{id:uid(),metaId:m1.id,valor:150,data:dkey(h)},{id:uid(),metaId:m2.id,valor:60,data:dkey(h)}];
  s.desejos=[{id:uid(),nome:'Tênis novo',valor:249.9,ts:Date.now()-5*36e5,status:'esperando'},{id:uid(),nome:'Fone bluetooth',valor:89.9,ts:Date.now()-26*36e5,status:'esperando'},{id:uid(),nome:'Bolsa da promoção',valor:159,ts:Date.now()-72*36e5,status:'desisti',fim:Date.now()-40*36e5}];
  return s;
}

function resumoMes(){
  const ref=new Date(),mk=mkey(ref),p=state.perfil;
  const fixos=sum(state.fixos.map(f=>f.valor));
  const livre=p.renda-fixos-p.guardarMes;
  const gastosMes=state.gastos.filter(g=>g.data.slice(0,7)===mk);
  const gasto=sum(gastosMes.map(g=>g.valor));
  const guardado=sum(state.depositos.filter(d=>d.data.slice(0,7)===mk).map(d=>d.valor));
  const extra=Math.max(0,guardado-p.guardarMes);
  const dias=new Date(ref.getFullYear(),ref.getMonth()+1,0).getDate();
  const diasRest=dias-ref.getDate()+1;
  const resta=livre-gasto-extra;
  const pagosIds=state.pagos[mk]||[];
  return{mk,fixos,livre,gasto,gastosMes,guardado,extra,dias,diasRest,resta,porDia:Math.max(0,resta)/diasRest,limiteSemana:Math.max(0,livre)/dias*7,pagosIds,
    impulso:sum(gastosMes.filter(g=>g.impulso).map(g=>g.valor)),nImpulso:gastosMes.filter(g=>g.impulso).length};
}
function sequencia(){
  const marc=new Set(state.gastos.map(g=>g.data).concat(Object.keys(state.diasZero)));
  const d=new Date();if(!marc.has(dkey(d)))d.setDate(d.getDate()-1);
  let n=0;while(marc.has(dkey(d))&&n<999){n++;d.setDate(d.getDate()-1);}return n;
}

  const m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',getComputedStyle(r).getPropertyValue('--plum').trim()||'#3A1D6E');}
function aplicarTema(){const t=state&&state.prefs?state.prefs.tema:'auto';if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t==='escuro'?'dark':'light');}

      <span class="ms-foot"><span>${mp?'Rumo a: '+esc(mp.nome):'Plano: guardar '+pct+'% da renda'}</span><span>${seq?seq+(seq===1?' dia anotando':' dias anotando seguidos'):'Anote hoje pra começar a sequência'}</span></span>

  const usado=r.livre>0?Math.min(100,Math.max(0,(r.livre-r.resta)/r.livre*100)):100;
  const cls=r.resta<0?'over':usado>85?'warn':'';
  const gastouHoje=state.gastos.some(g=>g.data===hojeK())||state.diasZero[hojeK()];
  let sub;
  if(r.livre<=0)sub='Contas fixas + guardar passam da renda. Dá uma olhada em <b>Plano</b> pra ajustar.';
  else if(r.resta<=0)sub='O livre do mês acabou. Segura firme até virar o mês, você consegue 💛';
  else sub=usado<1?'Mês começando. Anote cada gasto pra ver o ingresso baixar.':`Você já usou ${Math.round(usado)}% do livre do mês.`;
  const pm=p.guardarMes>0?Math.min(1,r.guardado/p.guardarMes):0;

  const dia=Math.floor(Date.now()/864e5);
  const dica=pool[dia%pool.length];
  const fixosOrd=state.fixos.slice().sort((a,b)=>b.valor-a.valor);

  return topo()+`
  <section class="ingresso" aria-label="Livre pra gastar">
    <div class="ing-main">
      <span class="ing-label">Livre pra gastar em ${MESES[h.getMonth()]}</span>
      <div class="ing-valor">${fmt(r.resta)}</div>
      <div class="meter ${cls}" role="progressbar" aria-valuenow="${Math.round(usado)}" aria-valuemin="0" aria-valuemax="100" aria-label="Quanto do livre já foi usado"><span style="width:${usado}%"></span></div>
      <p class="ing-sub">${sub}</p>
    </div>
    <div class="ing-stub"><span>Por dia</span><b>${r.livre>0&&r.resta>0?fmt(r.porDia):'R$ 0'}</b><small>válido até ${r.dias}/${h.getMonth()+1}</small></div>
  </section>
  <div class="plano-linha"><div><span>Renda</span><b class="num">${fmt(p.renda)}</b></div><div><span>Contas fixas</span><b class="num">${fmt(r.fixos)}</b></div><div><span>Guardar</span><b class="num">${fmt(p.guardarMes)}</b></div></div>
  ${cardPorque()}
  <div class="quick">
    <button data-a="novo-gasto"><span class="ico spend">💸</span>Anotar gasto</button>
    <button data-a="guardar"><span class="ico save">🐷</span>Guardar</button>
    <button data-a="ir" data-v="desejos"><span class="ico gold">⏳</span>Segurar compra</button>
    <button data-a="dia-zero" ${gastouHoje?'disabled style="opacity:.5"':''}><span class="ico plum">🙌</span>Não gastei hoje</button>
  </div>
  <section class="card">
    <div class="card-head"><h2>Cofrinho do mês</h2><a href="#metas">Metas</a></div>
    <div class="cofre">
      <div class="ring"><svg viewBox="0 0 92 92"><circle cx="46" cy="46" r="40" fill="none" stroke="var(--surface-2)" stroke-width="10"/><circle cx="46" cy="46" r="40" fill="none" stroke="var(--save)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pm)}" style="transition:stroke-dashoffset .8s"/></svg><span class="pct">${Math.round(pm*100)}%</span></div>
      <div class="cofre-txt"><span class="muted">Guardado em ${MESES[h.getMonth()]}</span><b>${fmt(r.guardado)}</b><span class="muted">${p.guardarMes<=0?'Defina quanto guardar em Plano.':r.guardado>=p.guardarMes?'Meta do mês batida! 🎉':'Faltam '+fmt(p.guardarMes-r.guardado)+' pra meta'}</span></div>
    </div>

  </section>
  <section class="card">
    <div class="card-head"><h2>Contas do mês</h2><span class="muted num" style="font-size:14px">${fmt(pagoTot)} de ${fmt(r.fixos)} pagas</span></div>

  </section>
  <section class="card">
    <div class="card-head"><h2>Últimos gastos</h2><a href="#semana">Ver semana</a></div>

function metaPrincipal(){return state.metas.find(m=>!(m.alvo>0&&guardadoMeta(m.id)>=m.alvo))||null;}
function cardPorque(){
  const m=metaPrincipal();
  if(!m)return `<button class="porque vazio" data-a="nova-meta"><span class="porque-emoji">✨</span><span class="porque-txt"><b>Qual é o seu objetivo?</b><small>Crie uma meta e escreva por que ela importa. Ajuda muito nos dias de vontade de gastar.</small></span></button>`;
  const g=guardadoMeta(m.id);
  return `<button class="porque" data-a="editar-meta" data-id="${m.id}"><span class="porque-emoji">${esc(m.emoji||'✨')}</span><span class="porque-txt"><small>Meu porquê</small>${m.porque?`<q><span>${esc(m.porque)}</span></q>`:`<em>Toque pra escrever por que "${esc(m.nome)}" importa pra você.</em>`}<small>${esc(m.nome)}: ${fmt(g)} de ${fmt(m.alvo)}${m.prazo?', até '+mesCurto(m.prazo):''}</small></span></button>`;
}
function linhaPrazo(m,g){
  if(!m.prazo||!(m.alvo>g))return '';
  const pede=(m.alvo-g)/mesesAte(m.prazo);
  const ativas=Math.max(1,state.metas.filter(x=>x.alvo>guardadoMeta(x.id)).length);
  const ok=state.perfil.guardarMes/ativas>=pede-0.5;
  return `<p class="hint">Pra chegar até ${mesCurto(m.prazo)}: ${fmt(Math.ceil(pede))} por mês <span class="chip ${ok?'ok':'aperto'}">${ok?'No ritmo':'Apertado'}</span></p>`;
}
function itemGasto(g){const c=cat(g.cat);return `<button class="row" data-a="editar-gasto" data-id="${g.id}"><span class="dot" style="--c:${c.cor}">${c.emoji}</span><span class="row-main"><b>${esc(g.desc||c.nome)}</b><small>${c.nome}, ${dataCurta(g.data)}${g.impulso?'<span class="tag">impulso</span>':''}</small></span><span class="row-val neg">−${fmt(g.valor)}</span></button>`;}

function telaSemana(){
  const r=resumoMes();
  const ws=weekStart(new Date());ws.setDate(ws.getDate()+semanaOffset*7);
  const dias=[];for(let i=0;i<7;i++){const d=new Date(ws);d.setDate(ws.getDate()+i);dias.push(d);}
  const ks=dias.map(dkey);
  const tot=ks.map(k=>sum(state.gastos.filter(g=>g.data===k).map(g=>g.valor)));
  const total=sum(tot),lim=r.limiteSemana,limDia=lim/7;
  const max=Math.max(limDia*1.5,Math.max.apply(null,tot),1);
  const fim=dias[6],hk=hojeK();
  const titulo=dias[0].getMonth()===fim.getMonth()?`${dias[0].getDate()} a ${fim.getDate()} de ${MESES[fim.getMonth()]}`:`${dias[0].getDate()}/${dias[0].getMonth()+1} a ${fim.getDate()}/${fim.getMonth()+1}`;
  const sobra=lim-total;
  const acabou=semanaOffset<0||(semanaOffset===0&&new Date().getDay()===0);
  const grupos=ks.map((k,i)=>({k,i,itens:state.gastos.filter(g=>g.data===k).sort((a,b)=>b.ts-a.ts)})).filter(g=>g.itens.length).reverse();
  const porCat=CATS.map(c=>({c,v:sum(r.gastosMes.filter(g=>g.cat===c.id).map(g=>g.valor))})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const maxCat=porCat.length?porCat[0].v:1;
  return topo()+`
  <section class="card">
    <div class="week-nav"><button class="icon-btn" data-a="semana" data-d="-1" aria-label="Semana anterior">${ICON.prev}</button><h2>${titulo}</h2><button class="icon-btn" data-a="semana" data-d="1" aria-label="Próxima semana" ${semanaOffset>=0?'disabled style="opacity:.35"':''}>${ICON.next}</button></div>
    <div class="bars" role="img" aria-label="Gastos por dia da semana">
      ${limDia>0?`<div class="lim" style="bottom:${limDia/max*120+26}px"><span>${fmt(limDia)}/dia</span></div>`:''}
      ${dias.map((d,i)=>`<div class="bcol ${tot[i]===0?'zero':''} ${limDia>0&&tot[i]>limDia?'over':''} ${ks[i]===hk?'today':''}"><i style="height:${Math.max(4,tot[i]/max*120)}px" title="${fmt(tot[i])}"></i><small>${DSEM[d.getDay()]}</small></div>`).join('')}
    </div>
    <div class="week-sum">
      <div class="stat"><span>Gastei</span><b>${fmt(total)}</b></div>
      <div class="stat ${sobra>=0?'good':'bad'}"><span>${sobra>=0?'Sobra da semana':'Passei'}</span><b>${fmt(Math.abs(sobra))}</b></div>
    </div>
    <p class="hint">Seu livre da semana é ${fmt(lim)}: o livre do mês dividido pelos dias.</p>
    ${acabou&&sobra>0?`<button class="btn save block" data-a="guardar" data-valor="${Math.floor(sobra)}">Mandar ${fmt(Math.floor(sobra))} de sobra pro cofrinho</button>`:''}
  </section>
  <section class="card">
    <div class="card-head"><h2>Dia a dia</h2></div>
    ${grupos.length?grupos.map(g=>`<div class="daygroup"><h3><span>${DSEM[dias[g.i].getDay()]}, ${dias[g.i].getDate()}/${dias[g.i].getMonth()+1}</span><span class="num">${fmt(tot[g.i])}</span></h3><div class="list">${g.itens.map(itemGasto).join('')}</div></div>`).join(''):`<div class="empty">Nenhum gasto nesta semana.</div>`}
  </section>
  <section class="card">
    <div class="card-head"><h2>Pra onde foi em ${MESES[new Date().getMonth()]}</h2><span class="muted num" style="font-size:14px">${fmt(r.gasto)}</span></div>
    ${porCat.length?porCat.map(x=>`<div class="catbar" style="--c:${x.c.cor}"><div class="catbar-top"><span>${x.c.emoji} ${x.c.nome}</span><b class="num">${fmt(x.v)}</b></div><div class="bar thin"><span style="width:${x.v/maxCat*100}%"></span></div></div>`).join(''):`<div class="empty">Os gastos do mês aparecem aqui por categoria.</div>`}
    ${r.nImpulso?`<div class="stat bad"><span>Por impulso no mês</span><b>${fmt(r.impulso)}</b> <small class="muted">em ${r.nImpulso} ${r.nImpulso===1?'compra':'compras'}</small></div>`:''}
  </section>`;
}

  <button class="btn primary block" data-a="nova-meta">+ Nova meta</button>`;
}

let aoFechar=null;
function abrir(titulo,html,mount){$('#sheet-title').textContent=titulo;$('#sheet-body').innerHTML=html;$('#sheet').hidden=false;document.body.style.overflow='hidden';if(mount)mount($('#sheet-body'));}

let tt=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;t.style.animation='none';void t.offsetWidth;t.style.animation='';clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2800);}
function confete(n){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('#confete'),ctx=c.getContext('2d'),dpr=window.devicePixelRatio||1;
  c.hidden=false;const W=c.width=innerWidth*dpr,H=c.height=innerHeight*dpr;
  const cs=getComputedStyle(document.documentElement);const cores=[cs.getPropertyValue('--plum-2').trim()||'#7B3FE4',cs.getPropertyValue('--stub').trim()||'#FFD84D','#12805A','#F5BE45','#C7447F','#5AA9FF'];
  const ps=[];for(let i=0;i<(n||90);i++)ps.push({x:W/2+(Math.random()-.5)*W*.25,y:H*.42,vx:(Math.random()-.5)*16*dpr,vy:(-Math.random()*15-5)*dpr,w:(Math.random()*6+5)*dpr,h:(Math.random()*4+3)*dpr,c:cores[i%cores.length],a:Math.random()*6,va:(Math.random()-.5)*.35});
  let t=0;(function f(){t++;ctx.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.42*dpr;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});if(t<120)requestAnimationFrame(f);else{ctx.clearRect(0,0,W,H);c.hidden=true;}})();
}

  L.push('💰 Renda: '+fmt(p.renda));

  state.fixos.forEach(f=>L.push('  • '+f.nome+': '+fmt(f.valor)+(r.pagosIds.indexOf(f.id)>-1?' ✅':' ⏳')));
  L.push('🐷 Guardar no mês: '+fmt(p.guardarMes)+' (guardado: '+fmt(r.guardado)+')');

  L.push('');
  const ws=weekStart(h);
  L.push('SEMANA '+ws.getDate()+'/'+(ws.getMonth()+1));
  let tw=0;
  for(let i=0;i<7;i++){const d=new Date(ws);d.setDate(ws.getDate()+i);const k=dkey(d);const gs=state.gastos.filter(g=>g.data===k);const t=sum(gs.map(g=>g.valor));tw+=t;
    L.push(DSEM[d.getDay()].toUpperCase()+': '+(gs.length?fmt(t)+' ('+gs.map(g=>(g.desc||cat(g.cat).nome)).join(', ')+')':'—'));}
  L.push('Total: '+fmt(tw)+' de '+fmt(r.limiteSemana));
  if(state.metas.length){L.push('');L.push('🎯 METAS');state.metas.forEach(m=>{const g=guardadoMeta(m.id);L.push('• '+m.nome+': '+fmt(g)+' de '+fmt(m.alvo)+' ('+(m.alvo?Math.round(g/m.alvo*100):0)+'%)');});}
  const des=state.desejos.filter(d=>d.status==='desisti');
  if(des.length){L.push('');L.push('💚 Comprinhas que segurei: '+fmt(sum(des.map(d=>d.valor))));}
  return L.join('\n');
}

  const renda=parseMoney(onb.renda),fx=sum(onb.fixos.map(f=>f.valor)),v=Math.round(renda*onb.pct/100),pede=pedePorMes(),l=renda-fx-v;

}

function onbLer(avancando){
  const s=onb.step,v=id=>{const e=document.getElementById(id);return e?e.value:'';};
  if(s===1){onb.nome=v('o-nome').trim();if(avancando&&!onb.nome){toast('Escreve seu nome pra gente continuar 💛');return false;}}
  if(s===2){onb.ocupTxt=v('o-ocuptxt').trim();if(avancando&&!onb.ocup){toast('Escolhe a opção mais perto do que você faz.');return false;}}
  if(s===4){onb.renda=parseMoney(v('o-renda'));if(avancando&&!(onb.renda>0)){toast('Coloca um valor aproximado, tipo 2500.');return false;}}
  if(s===5){const n=v('o-fnome').trim(),val=parseMoney(v('o-fvalor'));if(n&&val>0)onb.fixos.push({nome:n,valor:val,emoji:emojiFixo(n)});}
  if(s===6){onb.metaNome=v('o-mnome').trim();onb.metaAlvo=parseMoney(v('o-malvo'));
    if(avancando&&!onb.metaNome){toast('Escreve seu objetivo, ou toque em Pular.');return false;}
    if(avancando&&!(onb.metaAlvo>0)){toast('Coloca quanto custa, mais ou menos.');return false;}}
  if(s===7){onb.porque=v('o-porque').trim();onb.prazo=v('o-prazo');}
  if(s===8){onb.pct=+v('o-pct')||0;}
  return true;
}
function onbFinal(){
  const s=novoEstado();
  s.perfil={nome:onb.nome,renda:onb.renda,guardarMes:Math.round(onb.renda*onb.pct/100),dores:onb.dores,ocup:onb.ocup,ocupTxt:onb.ocupTxt,vibe:onb.vibe};
  s.fixos=onb.fixos.map(f=>({id:uid(),nome:f.nome,valor:f.valor,emoji:f.emoji}));
  if(onb.metaNome&&onb.metaAlvo>0)s.metas=[{id:uid(),nome:onb.metaNome,emoji:onb.metaEmoji||'✨',alvo:onb.metaAlvo,porque:onb.porque,prazo:onb.prazo}];
  state=s;onb=null;salvar();location.hash='#inicio';render();
  setTimeout(()=>{confete(110);toast('Pronto, '+s.perfil.nome+'! Seu planner está montado 🎉');},150);
}

/* ---------- formulários ---------- */
const F={
  gasto:f=>{const v=parseMoney(f.valor.value);if(!(v>0)){toast('Coloca o valor do gasto.');return;}
    const dados={valor:v,cat:(f.querySelector('input[name=cat]:checked')||{}).value||'outros',desc:f.desc.value.trim(),data:f.data.value||hojeK(),impulso:f.impulso.checked};
    const antes=resumoMes().porDia;
    if(f.id.value){const g=state.gastos.find(x=>x.id===f.id.value);Object.assign(g,dados);salvar();fechar();render();toast('Gasto atualizado.');return;}
    state.gastos.push(Object.assign({id:uid(),ts:Date.now()},dados));if(state.diasZero[dados.data])delete state.diasZero[dados.data];salvar();fechar();render();
    const r=resumoMes();
    toast(r.resta<0?'Anotado. O livre do mês passou um pouco, mas anotar já é o primeiro passo 💛':v>antes&&antes>0?'Anotado! Esse foi maior que o de um dia. Amanhã dá pra equilibrar.':'Anotado! Ainda tem '+fmt(r.resta)+' livres no mês.');},
  guardar:f=>{let v=parseMoney(f.valor.value);if(!(v>0)){toast('Coloca quanto quer guardar.');return;}
    const metaId=(f.querySelector('input[name=meta]:checked')||{}).value||state.metas[0].id;const m=state.metas.find(x=>x.id===metaId);
    const out=f.tipo.value==='out';if(out){v=-Math.min(v,guardadoMeta(metaId));if(!v){toast('Essa meta ainda não tem dinheiro guardado.');return;}}
    const antesMeta=guardadoMeta(metaId),antesMes=resumoMes().guardado;
    state.depositos.push({id:uid(),metaId,valor:v,data:hojeK()});salvar();fechar();render();
    if(out){toast('Retirada anotada. Imprevistos acontecem, foi pra isso que você guardou 💛');return;}
    const depoisMeta=antesMeta+v,gm=state.perfil.guardarMes,depoisMes=antesMes+v;
    if(m&&m.alvo>0&&antesMeta<m.alvo&&depoisMeta>=m.alvo){confete(160);toast('Meta "'+m.nome+'" conquistada! Que orgulho 🏆');}
    else if(gm>0&&antesMes<gm&&depoisMes>=gm){confete(130);toast('Meta do mês batida! 🎉');}
    else{confete(45);toast(fmt(v)+' no cofrinho! 🐷');}},
  meta:f=>{const alvo=parseMoney(f.alvo.value),nome=f.nome.value.trim();if(!nome||!(alvo>0)){toast('Coloca o nome e quanto quer juntar.');return;}
    const emoji=(f.querySelector('input[name=emoji]:checked')||{}).value||'🐷';
    if(f.id.value){Object.assign(state.metas.find(x=>x.id===f.id.value),{nome,alvo,emoji,porque:f.porque.value.trim(),prazo:f.prazo.value});toast('Meta atualizada.');}else{state.metas.push({id:uid(),nome,alvo,emoji,porque:f.porque.value.trim(),prazo:f.prazo.value});toast('Meta criada! Bora encher esse cofrinho ✨');}
    salvar();fechar();render();},
  fixo:f=>{const valor=parseMoney(f.valor.value),nome=f.nome.value.trim();if(!nome||!(valor>0)){toast('Coloca o nome e o valor.');return;}
    if(f.id.value)Object.assign(state.fixos.find(x=>x.id===f.id.value),{nome,valor,emoji:emojiFixo(nome)});else state.fixos.push({id:uid(),nome,valor,emoji:emojiFixo(nome)});
    salvar();fechar();render();toast('Contas fixas atualizadas.');},
  perfil:f=>{const renda=parseMoney(f.renda.value),nome=f.nome.value.trim();if(!nome||!(renda>0)){toast('Confere o nome e a renda.');return;}
    state.perfil.nome=nome;state.perfil.renda=renda;state.perfil.guardarMes=Math.round(renda*(+f.pct.value)/100);salvar();render();toast('Plano atualizado!');},
  desejo:f=>{const nome=f.nome.value.trim(),valor=parseMoney(f.valor.value);if(!nome||!(valor>0)){toast('Coloca o que é e quanto custa.');return;}
    state.desejos.push({id:uid(),nome,valor,ts:Date.now(),status:'esperando'});salvar();render();toast('Combinado! Daqui a 24h a gente decide junto ⏳');},
  restaurar:f=>{const s=lerBackup(f.cod.value);if(!s){toast('Esse código não parece um backup do Planner. Confere se copiou inteiro.');return;}state=s;salvar();fechar();render();toast('Backup restaurado!');}
};

    document.getElementById('o-pct-val').textContent=x.val;document.getElementById('o-pct-lbl').textContent=x.lbl;document.getElementById('o-pct-livre').textContent=x.livre;
    const m=document.getElementById('o-pct-meta');m.textContent=x.meta;m.hidden=!x.meta;}
  if(t.id==='o-prazo'&&onb){onb.prazo=t.value;const e=document.getElementById('o-pede'),pd=pedePorMes();e.hidden=!pd;if(pd)e.textContent='Pra chegar até '+mesCurto(onb.prazo)+', são '+fmt(pd)+' por mês.';}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)fechar();
  if(e.key==='Enter'&&onb&&e.target.tagName==='INPUT'&&e.target.type!=='month'){e.preventDefault();if(e.target.id==='o-fnome'||e.target.id==='o-fvalor')A['onb-add-fixo']();else A['onb-seguir']();}});
window.addEventListener('hashchange',()=>{if(!$('#sheet').hidden)fechar();render();window.scrollTo(0,0);});

/* contagem dos desejos */
setInterval(()=>{
  if(!state||telaAtual()!=='desejos')return;
  let virou=false;
  document.querySelectorAll('[data-ate]').forEach(p=>{const fim=+p.dataset.ate;if(Date.now()>=fim){if(!p.closest('.pronto'))virou=true;}else p.textContent='Faltam '+faltam(fim);});
  if(virou&&$('#sheet').hidden&&!(document.activeElement&&document.activeElement.tagName==='INPUT'))render();
},20000);

/* início */
state=carregar();
if(state){const b=novoEstado();state=Object.assign(b,state,{prefs:Object.assign(b.prefs,state.prefs||{}),perfil:Object.assign(b.perfil,state.perfil||{})});}
render();
})();
</script>
